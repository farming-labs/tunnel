[package]
name = "farm-js-tunnel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Persistent Rust N-API preview tunnel for Farm.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
napi = { version = "3.12.0", features = ["napi8", "tokio_rt"] }
napi-derive = "3.6.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
strip = "symbols"
